<head>

<style>
:root{--bg:#05070b;--panel:#0b1018;--panel2:#101722;--line:#222d3b;--cyan:#00d9ff;--muted:#8b99aa;--red:#ff5267;--green:#15d99a;--yellow:#ffd34e;--blue:#57a5ff}
*{box-sizing:border-box}
html{min-width:320px;background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#10212c 0,transparent 44%),var(--bg);color:#f4f7fb;font-family:Inter,system-ui,Arial,sans-serif;min-height:100vh}
button{font:inherit}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.topbar{height:76px;border-bottom:1px solid #1c2734;background:rgba(5,7,11,.88);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(14px,4vw,48px);gap:15px;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:43px;height:43px;object-fit:contain;border-radius:12px;background:#080d13;border:1px solid #273543;padding:3px}
.brand-name{font-weight:900;letter-spacing:-.5px;font-size:18px;white-space:nowrap}
.brand-name span{color:var(--cyan)}
.brand-sub{font-size:10px;color:#8290a1;letter-spacing:2px;font-weight:800;margin-top:3px}
.topright{display:flex;align-items:center;gap:10px}
.pill{border:1px solid #243140;background:#0d141d;padding:8px 12px;border-radius:999px;color:#b9c4d0;font-size:12px;font-weight:700;white-space:nowrap}
.pill .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#27d98c;margin-right:7px;box-shadow:0 0 12px #27d98c}
.link-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#00d9ff,#58e6ff);border:0;border-radius:10px;padding:11px 15px;color:#031016;font-size:12px;font-weight:900;box-shadow:0 5px 20px #00d9ff1a;transition:transform .2s,filter .2s}
.link-btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
main{max-width:1500px;margin:0 auto;padding:28px clamp(12px,3vw,38px) 32px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:10px 0 22px}
.kicker{color:var(--cyan);font-size:11px;font-weight:900;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px}
h1{font-size:clamp(29px,4vw,48px);letter-spacing:-2px;line-height:1.05;margin:0;font-weight:900}
h1 .highlight{background:linear-gradient(100deg,#fff 0%,#00d9ff 60%,#83f0ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:13px;line-height:1.7;margin:11px 0 0;max-width:610px}
.hero-badge{flex-shrink:0;display:flex;align-items:center;gap:10px;border:1px solid #243445;background:linear-gradient(120deg,#101b27,#0b1018);padding:12px 15px;border-radius:14px}
.hero-badge .robot{font-size:27px}
.hero-badge b{display:block;font-size:12px}
.hero-badge small{display:block;font-size:10px;color:#90a0af;margin-top:3px}
.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);gap:18px;align-items:start}
.card{border:1px solid var(--line);background:linear-gradient(145deg,rgba(16,23,34,.97),rgba(8,12,18,.97));border-radius:20px;box-shadow:0 18px 60px #0003;overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 20px;border-bottom:1px solid #202b38}
.card-title{font-weight:900;font-size:14px;letter-spacing:.1px}
.card-sub{font-size:10px;color:var(--muted);margin-top:4px}
.board-label{font-size:10px;font-weight:900;color:#7f91a3;letter-spacing:1.3px;border:1px solid #2a3746;border-radius:7px;padding:6px 8px}
.board-wrap{padding:clamp(10px,2.6vw,25px);display:flex;justify-content:center;align-items:center;position:relative;background:radial-gradient(ellipse at center,#10202b66,transparent 65%)}
#board{display:block;width:100%;max-width:670px;height:auto;aspect-ratio:1;border-radius:9px;filter:drop-shadow(0 12px 25px #0008);touch-action:manipulation}
#board .token{cursor:pointer;transition:opacity .2s}
#board .token:focus{outline:none}
#board .token.clickable{cursor:pointer}
.board-footer{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:0 20px 18px;color:#8998a8;font-size:10px}
.legend{display:flex;gap:12px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:7px;height:7px;border-radius:50%}
#hint{font-weight:700;color:#d1dce6;text-align:right}
.rightcol{display:flex;flex-direction:column;gap:16px}
.players{padding:16px}
.player{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #243140;background:#0a1018;border-radius:14px;transition:border-color .2s,box-shadow .2s}
.player+.player{margin-top:10px}
.player.active{border-color:var(--cyan);box-shadow:0 0 0 1px #00d9ff22,0 0 24px #00d9ff0b}
.avatar{width:48px;height:48px;display:grid;place-items:center;border-radius:13px;font-size:26px;background:#161f2b;flex-shrink:0}
.avatar.red{background:#ff52671a;border:1px solid #ff526744}
.avatar.yellow{background:#ffd34e1a;border:1px solid #ffd34e44}
.playerinfo{min-width:0;flex:1}
.playername{font-weight:900;font-size:13px;display:flex;align-items:center;gap:7px}
.playerlabel{font-size:9px;font-weight:900;border-radius:5px;padding:4px 5px;background:#17212d;color:#9eacbb;letter-spacing:.5px}
.playerdesc{font-size:10px;color:#91a0b0;margin-top:5px}
.token-count{font-size:11px;font-weight:900;text-align:right;white-space:nowrap}
.token-count small{display:block;color:#8494a4;font-weight:600;margin-top:4px;font-size:9px}
.status-live{display:flex;gap:6px;align-items:center;color:#4ce0a1;font-size:10px;font-weight:800}
.status-live:before{content:'';width:6px;height:6px;border-radius:50%;background:#4ce0a1;box-shadow:0 0 10px #4ce0a1}
.dice-card{padding:18px}
.dice-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dice-title{font-size:14px;font-weight:900}
.dice-round{color:#8292a3;font-size:10px}
.dice-center{display:flex;align-items:center;gap:17px;padding:18px 0}
.dice-face{width:82px;height:82px;border-radius:18px;background:linear-gradient(145deg,#fff,#dfe8ef);color:#111a25;display:grid;place-items:center;font-size:44px;font-weight:900;box-shadow:0 8px 24px #0006,inset 0 -3px 0 #aebcc8;flex-shrink:0;transition:transform .2s;cursor:pointer;touch-action:manipulation;user-select:none}.dice-face:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}.dice-face.is-disabled{cursor:not-allowed;opacity:.76}
.dice-face.rolling{animation:roll .45s ease-in-out}
@keyframes roll{0%{transform:rotate(0) scale(1)}45%{transform:rotate(17deg) scale(1.08)}100%{transform:rotate(0) scale(1)}}
.dice-instruction{font-size:12px;font-weight:800;line-height:1.5}
.dice-help{font-size:10px;line-height:1.6;color:#8e9cac;margin-top:5px}
.primary-btn,.secondary-btn{width:100%;min-height:47px;border-radius:11px;font-size:12px;font-weight:900;cursor:pointer;transition:transform .18s,filter .18s,background .18s}
.primary-btn{border:0;color:#041119;background:linear-gradient(110deg,#00d9ff,#67eaff);box-shadow:0 8px 25px #00d9ff16}
.primary-btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.08)}
.primary-btn:disabled{cursor:not-allowed;opacity:.4;filter:grayscale(.45)}
.secondary-btn{margin-top:9px;border:1px solid #2d3948;color:#cbd5df;background:#131b26}
.secondary-btn:hover{border-color:#00d9ff;color:#fff;background:#15212c}
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.action-row .secondary-btn{margin:0}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #202b38;margin-top:15px;padding-top:14px;font-size:11px;color:#a3afbc}
.switch{border:1px solid #334253;border-radius:999px;background:#17222e;color:#d2dce7;padding:6px 9px;font-size:10px;font-weight:800;cursor:pointer}
.switch.on{color:#091118;background:#00d9ff;border-color:#00d9ff}
.log-card{padding:17px 18px}
.log-head{display:flex;justify-content:space-between;align-items:center}
.log-head h2{font-size:13px;margin:0;font-weight:900}
.log-head span{font-size:10px;color:#8797a8}
#moveLog{display:flex;flex-direction:column;gap:8px;margin-top:13px;max-height:165px;overflow:auto}
.log-item{display:flex;gap:9px;align-items:flex-start;font-size:10px;line-height:1.5;color:#a7b4c2}
.log-icon{width:23px;height:23px;display:grid;place-items:center;background:#18212c;border-radius:7px;flex-shrink:0}
.log-item b{color:#e5ebf2}
.rules{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rule{padding:14px;border:1px solid #202c39;background:#0a1018;border-radius:13px}
.rule-icon{font-size:20px}
.rule b{display:block;font-size:11px;margin:8px 0 5px}
.rule p{font-size:10px;line-height:1.6;color:#92a0af;margin:0}
footer{border-top:1px solid #1e2935;padding:23px 15px 30px;text-align:center;color:#788897;font-size:10px;line-height:1.8}
footer img{width:19px;height:19px;object-fit:contain;vertical-align:middle;margin-right:5px}
footer a{color:var(--cyan);font-weight:900}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:#142230;border:1px solid #2f4859;color:white;padding:12px 17px;border-radius:12px;box-shadow:0 15px 40px #0008;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;font-size:12px;font-weight:700;max-width:calc(100vw - 30px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.winner-overlay{position:fixed;inset:0;background:#02050bd9;backdrop-filter:blur(10px);display:none;place-items:center;padding:20px;z-index:25}
.winner-overlay.show{display:grid}
.winner-box{max-width:390px;width:100%;padding:32px 25px;text-align:center;border-radius:22px;border:1px solid #2a3c4b;background:linear-gradient(145deg,#14202c,#080d14);box-shadow:0 20px 80px #0009}
.winner-emoji{font-size:54px}
.winner-box h2{font-size:25px;letter-spacing:-.7px;margin:14px 0 8px}
.winner-box p{font-size:12px;line-height:1.7;color:#a0afbd;margin:0 0 22px}
@media(max-width:1000px){.hero{align-items:flex-start}.hero-badge{display:none}}
@media(max-width:760px){.topbar{height:66px}.topright .pill{display:none}main{padding-top:20px}.layout{grid-template-columns:1fr}.rightcol{display:grid;grid-template-columns:1fr}.board-wrap{padding:10px}.card-head{padding:14px}.board-footer{padding:0 13px 14px;align-items:flex-start;flex-direction:column}#hint{text-align:left}.rules{grid-template-columns:1fr 1fr}.rules .rule:last-child{grid-column:1/-1}.hero{margin-top:4px}.hero p{font-size:12px}.brand img{width:37px;height:37px}.brand-name{font-size:15px}}
@media(max-width:420px){.brand-sub{font-size:8px;letter-spacing:1.3px}.brand-name{font-size:13px}.topbar{padding:0 10px}.link-btn{padding:10px;font-size:10px}.rules{grid-template-columns:1fr}.rules .rule:last-child{grid-column:auto}.dice-face{width:70px;height:70px;font-size:38px}.hero h1{letter-spacing:-1.3px}.player{padding:10px}.token-count{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* =============== FRIENDS LOBBY / ACCOUNT UI =============== */

.layout{grid-template-columns:245px minmax(0,1fr);gap:16px}

.mode-selector{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 16px;border:1px solid #243444;border-radius:16px;background:linear-gradient(120deg,#101c28,#0a111a);min-width:0}
.mode-title{font-size:11px;font-weight:900;letter-spacing:1.1px;color:#e9f3fb}

.mode-btn:hover{border-color:var(--cyan);color:#fff}

.game-fullscreen .rightcol{max-height:calc(100vh - 74px);min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-right:3px}

.game-fullscreen .avatar{width:46px;height:46px}
@media(max-width:1000px){.game-content{grid-template-columns:minmax(0,1fr) 280px}}
@media(max-width:760px){.game-content{grid-template-columns:1fr}.mode-selector{align-items:flex-start;flex-direction:column}.mode-buttons{width:100%;display:grid;grid-template-columns:1fr 1fr}.mode-btn{padding:10px 7px;font-size:9px}.game-fullscreen{overflow:auto!important}.game-fullscreen .game-content{height:auto;display:grid;grid-template-columns:1fr}.game-fullscreen .board-card{height:auto;min-height:0}.game-fullscreen .board-card .board-wrap{flex:none}.game-fullscreen .board-card #board{width:100%;height:auto;max-height:none}.game-fullscreen .rightcol{max-height:none;overflow:visible;display:grid;grid-template-columns:1fr}.game-fullscreen .dice-card{order:0}}

.lobby{min-width:0;align-self:stretch}
.lobby-section{padding:15px;border-bottom:1px solid #202b38}
.lobby-section:last-child{border-bottom:0}
.lobby-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:13px}

.lobby-avatar{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#142a37;border:1px solid #1e5264;font-size:20px;flex-shrink:0}
.lobby-user-name{font-size:12px;font-weight:900;overflow-wrap:anywhere}

.lobby-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.profile-dialog{position:relative;width:min(100%,460px);max-height:calc(100vh - 32px);overflow:auto;padding:24px;border:1px solid #304252;border-radius:20px;background:linear-gradient(145deg,#14202c,#080d14);box-shadow:0 25px 90px #000b}
.profile-title{font-size:22px;font-weight:900;letter-spacing:-.7px;margin:3px 40px 6px 0}

.lobby-btn{min-height:37px;padding:8px 9px;border-radius:9px;border:1px solid #304052;background:#121b26;color:#d6e0eb;font-size:10px;font-weight:900;cursor:pointer}

.game-invite-status{font-size:10px;line-height:1.6;color:#8e9eae;margin-top:8px;overflow-wrap:anywhere}

.friend-icon{width:30px;height:30px;display:grid;place-items:center;position:relative;border-radius:9px;background:#172330;flex-shrink:0;font-size:15px}.friend-icon.online:after,.friend-icon.offline:after{content:"";position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;border:2px solid #0a1119;border-radius:50%}.friend-icon.online:after{background:#36df91;box-shadow:0 0 8px #36df91aa}.friend-icon.offline:after{background:#788493}

@media(max-width:760px){.home-grid,.shop-grid,.friend-room-slots{grid-template-columns:1fr}.home-hero-row{align-items:flex-start}.bot-setup{margin-left:0}.emoji-toolbar{align-items:flex-start}.home-play{width:100%}.friend-room-head{flex-direction:column}}

function drawBoard(){
 let s='<defs><filter id="tokenGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="boardBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fbff"/><stop offset="1" stop-color="#dce3ec"/></linearGradient></defs>';
 s+='<rect x="0" y="0" width="600" height="600" rx="5" fill="#d9e0e9"/>';

 zones.forEach(([c,x,y])=>{s+='<rect x="'+(x*40)+'" y="'+(y*40)+'" width="240" height="240" fill="'+COLORS[c]+'" opacity=".96"/>';s+='<rect x="'+(x*40+22)+'" y="'+(y*40+22)+'" width="196" height="196" rx="8" fill="'+SOFT[c]+'" stroke="#ffffff" stroke-width="2"/>';});
 // Outer route cells.
 PATH.forEach((p,i)=>{let c=SOFT.red;if(i===0)c=COLORS.red;else if(i===13)c=COLORS.green;else if(i===26)c=COLORS.yellow;else if(i===39)c=COLORS.blue;else c="#f8fafc";s+=cell(p[0],p[1],c,i%13===0?"#ffffff":"#cbd4df");if(SAFE.has(i)){s+='<polygon points="'+starPoints(p[0]*40+20,p[1]*40+20,9,4.2,5)+'" fill="'+(i===0? "#fff": "#738293")+'" opacity=".95"/>';if([0,13,26,39].includes(i))s+='<circle cx="'+(p[0]*40+20)+'" cy="'+(p[1]*40+20)+'" r="14" fill="'+COLORS[({0:"red",13:"green",26:"yellow",39:"blue"})[i]]+'" stroke="#fff" stroke-width="2"/>';}});
 // Home lanes.
 Object.keys(LANES).forEach(c=>LANES[c].forEach(p=>{s+=cell(p[0],p[1],COLORS[c],"#ffffff");}));
 // Central four-color finish.
 s+=polygon([[6,6],[9,6],[7.5,7.5]],COLORS.red);
 s+=polygon([[9,6],[9,9],[7.5,7.5]],COLORS.green);
 s+=polygon([[9,9],[6,9],[7.5,7.5]],COLORS.yellow);
 s+=polygon([[6,9],[6,6],[7.5,7.5]],COLORS.blue);
 s+='<circle cx="300" cy="300" r="18" fill="#0a111a" stroke="#ffffff" stroke-width="2"/><text x="300" y="304" text-anchor="middle" font-size="10" font-weight="900" fill="#ffffff">HOME</text>';
 // Subtle labels in home bases.
 s+='<text x="120" y="119" text-anchor="middle" font-size="17" font-weight="900" fill="#d82f48" opacity=".42">YOU</text>';
 s+='<text x="480" y="119" text-anchor="middle" font-size="17" font-weight="900" fill="#b28700" opacity=".65">NEXUS AI</text>';
 s+='<text x="120" y="479" text-anchor="middle" font-size="13" font-weight="900" fill="#3478c9" opacity=".6">BLUE LANE</text>';
 s+='<text x="480" y="479" text-anchor="middle" font-size="13" font-weight="900" fill="#168a65" opacity=".6">GREEN LANE</text>';
 // Base circles are drawn before movable pieces.
 for(const c of ["red","green","yellow","blue"]){
   BASES[c].forEach(pos=>{let cx=pos[0]*40,cy=pos[1]*40;s+=circle(cx,cy,16,"#ffffff",COLORS[c],3);s+=circle(cx,cy,10,SOFT[c],"#ffffff",1);});
 }
 // Make the active players' base cells more legible.
 for(const c of ["red","yellow"]){
   BASES[c].forEach((pos,i)=>{let tok=teams.find(t=>t.id===c).tokens[i];if(tok.progress===-1)return;});
 }
 s+='<rect x="0.8" y="0.8" width="598.4" height="598.4" rx="5" fill="none" stroke="#9aa9b8" stroke-width="1.5"/>';
 // Draw active tokens. Occupied pieces get a small offset so every piece can be clicked.
 const groups=new Map();
 teams.forEach(t=>t.tokens.forEach(tok=>{let pos=tokenPos(t,tok);let key=pos[0].toFixed(2)+","+pos[1].toFixed(2);if(!groups.has(key))groups.set(key,[]);groups.get(key).push({t,tok,pos});}));
 const offsets=[[0,0],[-8,-8],[8,-8],[-8,8],[8,8],[0,-10],[0,10]];
 teams.forEach(t=>t.tokens.forEach(tok=>{
   const pos=tokenPos(t,tok),key=pos[0].toFixed(2)+","+pos[1].toFixed(2),arr=groups.get(key)||[],idx=arr.findIndex(z=>z.t.id===t.id&&z.tok.id===tok.id),off=arr.length>1?(offsets[idx%offsets.length]||[0,0]):[0,0],cx=pos[0]*40+20+off[0],cy=pos[1]*40+20+off[1];
   const canControlTurn=multiplayer?multiplayer.started&&turn===multiplayer.mySide:turn===0;
   const isLegal=canControlTurn&&teams[turn]?.id===t.id&&legal.includes(tok.id)&&!busy&&!gameOver;
   const isSelected=selectedToken===tok.id;
   let stroke=isLegal?"#ffffff":"#17202a",sw=isLegal?3:2;
   s+='<g class="token '+(isLegal?"clickable":"")+'" data-team="'+t.id+'" data-token="'+tok.id+'" tabindex="'+(isLegal?0:-1)+'" role="button" aria-label="'+t.name+' token '+(tok.id+1)+(isLegal?", legal move":"")+'" opacity="'+(isLegal?1:0.96)+'">';
   if(isLegal)s+=circle(cx,cy,18,"none","#ffffff",2.5,'stroke-dasharray="3 3" filter="url(#tokenGlow)"');
   s+=circle(cx,cy,14,COLORS[t.id],stroke,sw,'filter="url(#tokenGlow)"');
   s+=circle(cx-3,cy-4,4,"#ffffff","none",0,'opacity=".85"');
   s+='<text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" font-size="11" font-weight="900" fill="'+(t.id==="yellow"?"#493700":"#ffffff")+'">'+(tok.id+1)+'</text>';

 }));
 svg.innerHTML=s;
 svg.querySelectorAll(".token.clickable").forEach(el=>{
   el.addEventListener("click",()=>chooseToken(el.dataset.team,Number(el.dataset.token)));

let selectedToken=null;
function tokenPos(team,tok){
 if(tok.progress<0){return BASES[team.id][tok.id];}

}
function legalFor(team,roll){return team.tokens.filter(t=>{if(t.progress===57)return false;if(t.progress===-1)return roll===6;return t.progress+roll<=57;}).map(t=>t.id);}
function addLog(icon,html){

let audioCtx=null;
function beep(freq=440,duration=.08,type="sine"){if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=.045;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.stop(audioCtx.currentTime+duration);}catch(e){}}
function setHint(text){$("hint").textContent=text;}

async function selectPlayMode(mode){
 if(mode==="friends"){
  if(multiplayer&&!multiplayer.finished){playMode="friends";updateModeUI();updateUI();toast("You are already in a live friend room.");return;}

function rankMove(team,tokenId,roll){
 const tok=team.tokens.find(t=>t.id===tokenId);const next=tok.progress===-1?0:tok.progress+roll;
 if(next===57)return 1000;
 const global=next<=51?(team.start+next)%52:null;let score=5+next*.3;
 const skill=Math.max(1,Math.min(9,Math.round(Math.log10(Math.max(200,robotChallenge)/200+1)*3)+1));
 if(tok.progress===-1)score+=skill*7;
 if(global!==null){
  if(SAFE.has(global))score+=skill*5;
  const rivals=teams.filter(other=>other.id!==team.id);
  const captured=rivals.some(rival=>rival.tokens.some(t=>t.progress>=0&&t.progress<=51&&((rival.start+t.progress)%52)===global));
  if(captured&&!SAFE.has(global))score+=skill*12;
  const danger=rivals.some(rival=>rival.tokens.filter(t=>t.progress>=0&&t.progress<=51).some(t=>{const their=(rival.start+t.progress)%52;const dist=(global-their+52)%52;return dist>=1&&dist<=6;}));
  if(danger)score-=skill*2;
 }
 if(next>=52)score+=skill*6;return score+Math.random()*2;
}

}

function doMove(teamId,id,fromRemote=false){
 if(gameOver||die===null)return;
 if(multiplayer&&!fromRemote)sendGameAction({kind:"move",teamId,id,turn});
 const team=teams.find(t=>t.id===teamId),tok=team.tokens.find(t=>t.id===id),roll=die,old=tok.progress;
 tok.progress=old===-1?0:old+roll;
 let captured=0;
 const onRing=tok.progress<=51;
 if(onRing){
   const square=(team.start+tok.progress)%52;
   if(!SAFE.has(square)){
     teams.filter(t=>t.id!==teamId).forEach(other=>other.tokens.forEach(enemy=>{
       if(enemy.progress>=0&&enemy.progress<=51&&(other.start+enemy.progress)%52===square){enemy.progress=-1;captured++;}
     }));
   }
 }
 totalMoves++;
 let actor=teams.find(t=>t.id===teamId);
 let message=multiplayer?(teamId===teams[multiplayer.mySide]?.id?"You":actor?.name||"Friend"):(teamId==="red"?"You":actor?.name||"Nexus");
 let action=old===-1?"launched token "+(id+1):"moved token "+(id+1);
 if(tok.progress===57)action="brought token "+(id+1)+" home";
 if(captured)action+=" and captured "+captured+" token"+(captured>1?"s":"");
 addLog(teamId==="red"?"🔴":"🤖","<b>"+message+"</b> "+action+" with a "+roll+".");
 if(captured){beep(180,.22,"sawtooth");toast("Capture! "+message+" sent a token back to base.");}
 else if(tok.progress===57){beep(750,.12);setTimeout(()=>beep(980,.18),100);toast(message+" brought a token home!");}
 else {beep(500,.07);}
 die=null;legal=[];selectedToken=null;
 const winner=team.tokens.every(t=>t.progress===57);
 if(winner){gameOver=true;busy=false;updateUI();showWinner(teamId);if(multiplayer&&!fromRemote)finishGameInvite();return;}
 updateUI();

}

async function loadLobby(){
 if(!ludoSupabase||!ludoUser)return;
 lobbySetStatus("lobbyListStatus","Refreshing your friends…");
 try{
  const {data:rows,error}=await ludoSupabase.from("ludo_friend_requests").select("id,sender_id,receiver_id,status,created_at").or("sender_id.eq."+ludoUser.id+",receiver_id.eq."+ludoUser.id).order("created_at",{ascending:false}).limit(150);
  if(error)throw error;
  const ids=[...new Set((rows||[]).flatMap(r=>[r.sender_id,r.receiver_id]).filter(id=>id!==ludoUser.id))];
  let profiles=[];
  if(ids.length){const res=await ludoSupabase.from("ludo_profiles").select("id,username,avatar_emoji").in("id",ids);if(res.error)throw res.error;profiles=res.data||[];}
  const byId=new Map(profiles.map(p=>[p.id,p]));
  const friends=[],incoming=[],outgoing=[];
  for(const r of rows||[]){
   const otherId=r.sender_id===ludoUser.id?r.receiver_id:r.sender_id;
   const other=byId.get(otherId);if(!other)continue;
   if(r.status==="accepted"){if(!friends.some(f=>f.id===other.id))friends.push(other);}
   else if(r.status==="pending"&&r.receiver_id===ludoUser.id){incoming.push({...other,requestId:r.id,id:r.id,profileId:other.id});}
   else if(r.status==="pending"&&r.sender_id===ludoUser.id){outgoing.push({...other,id:other.id,inviteId:r.id,status:"pending"});}
  }
  lobbyRowsCache={friends,incoming,outgoing};
  showLobbyRows(friends,incoming,outgoing);
  await loadGameInvites();
  lobbySetStatus("lobbyListStatus","");
 }catch(err){
  console.error("Ludo lobby load error:",err);
  lobbySetStatus("lobbyListStatus","Friend list unavailable. Run supabase-setup.sql in the linked Supabase project's SQL Editor.", "error");
 }
}
async function sendFriendInvite(event){
 event.preventDefault();if(!ludoSupabase||!ludoUser||lobbyBusy)return;
 const username=$("inviteUsername").value.trim().toLowerCase();
 if(!/^[a-z0-9_]{3,20}$/.test(username)){lobbySetStatus("inviteStatus","Usernames must be 3–20 letters, numbers or underscores.","error");return;}
 lobbyBusy=true;$("inviteSendBtn").disabled=true;lobbySetStatus("inviteStatus","Looking up @"+username+"…");
 try{
  const {data:target,error}=await ludoSupabase.from("ludo_profiles").select("id,username").eq("username",username).maybeSingle();
  if(error)throw error;
  if(!target)throw new Error("No Ludo player found with username @"+username+". Check the spelling.");
  if(target.id===ludoUser.id)throw new Error("You cannot invite your own account.");
  const {data:existing,error:existingError}=await ludoSupabase.from("ludo_friend_requests").select("id,status,sender_id,receiver_id").or("and(sender_id.eq."+ludoUser.id+",receiver_id.eq."+target.id+"),and(sender_id.eq."+target.id+",receiver_id.eq."+ludoUser.id+")").limit(10);
  if(existingError)throw existingError;
  if((existing||[]).some(r=>r.status==="accepted"))throw new Error("@"+username+" is already your friend.");
  if((existing||[]).some(r=>r.status==="pending")){
   const pending=(existing||[]).find(r=>r.status==="pending");
   if(pending.receiver_id===ludoUser.id)throw new Error("@"+username+" has already invited you. Accept the request in Incoming requests.");
   throw new Error("You have already invited @"+username+".");
  }
  const {error:insertError}=await ludoSupabase.from("ludo_friend_requests").insert({sender_id:ludoUser.id,receiver_id:target.id,status:"pending"});
  if(insertError)throw insertError;
  $("inviteUsername").value="";
  lobbySetStatus("inviteStatus","Invite sent to @"+target.username+". They can accept it after logging in.","ok");
  await loadLobby();
 }catch(err){lobbySetStatus("inviteStatus",err.message||"Could not send invitation.","error");}
 finally{lobbyBusy=false;$("inviteSendBtn").disabled=!ludoUser;}
}

async function sendGameInvite(targetId){
 if(!ludoSupabase||!ludoUser||gameInviteBusy)return;
 if(multiplayer&&!multiplayer.finished){toast("Finish or leave your current match first.");return;}
 gameInviteBusy=true;lobbySetStatus("gameInviteStatus","Preparing your friends room…");
 try{
  if(!activeRoomId)activeRoomId=(window.crypto?.randomUUID?crypto.randomUUID():"room-"+Date.now()+"-"+Math.random().toString(36).slice(2,9));
  const {data:existing,error:lookupError}=await ludoSupabase.from("ludo_game_invites").select("id,status,sender_id,receiver_id").or("and(sender_id.eq."+ludoUser.id+",receiver_id.eq."+targetId+"),and(sender_id.eq."+targetId+",receiver_id.eq."+ludoUser.id+")").in("status",["pending","accepted"]).limit(5);
  if(lookupError)throw lookupError;
  if((existing||[]).some(r=>r.status==="accepted"))throw new Error("You already have an active Ludo room with this friend.");
  if((existing||[]).some(r=>r.status==="pending"))throw new Error("A Ludo invitation is already pending between you.");
  const {data:roomRows,error:roomError}=await ludoSupabase.from("ludo_game_invites").select("seat").eq("room_id",activeRoomId);
  if(roomError)throw roomError;
  const used=new Set([0,...(roomRows||[]).map(r=>Number(r.seat)).filter(Number.isFinite)]);
  const seat=[1,2,3].find(n=>!used.has(n));if(!seat)throw new Error("This room already has four player seats.");
  const {error}=await ludoSupabase.from("ludo_game_invites").insert({sender_id:ludoUser.id,receiver_id:targetId,status:"pending",room_id:activeRoomId,seat});
  if(error)throw error;
  lobbySetStatus("gameInviteStatus","🎮 Room invite sent. You can invite up to three friends; all invited players must accept before the room starts.","ok");
  await loadGameInvites();
 }catch(err){lobbySetStatus("gameInviteStatus",err.message||"Could not send room invitation.","error");}
 finally{gameInviteBusy=false;}
}

function enterOnlineMatchGroup(roomId,roster,userId,isRoom=true){
 if(ignoredGameInviteIds.has(roomId))return;
 const me=roster.find(p=>p.id===userId);if(!me)return;
 if(multiplayer?.inviteId===roomId)return;
 if(multiplayer?.channel&&ludoSupabase)ludoSupabase.removeChannel(multiplayer.channel).catch(()=>{});
 const ordered=roster.slice().sort((a,b)=>a.seat-b.seat);
 multiplayer={inviteId:roomId,mySide:me.seat,players:ordered,partner:ordered.find(p=>p.id!==userId)||null,channel:null,started:false,finished:false,isRoom:!!isRoom};
 playMode="friends";$("homeDashboard").style.display="none";$("modeSelector").style.display="none";$("friendRoomPanel").style.display="none";$("gameContent").style.display="grid";updateModeUI();
 lobbySetStatus("gameInviteStatus","Connecting "+ordered.length+" room player"+(ordered.length===1?"":"s")+"…");
 const channel=ludoSupabase.channel("ludo-game-"+roomId,{config:{broadcast:{self:false},presence:{key:userId}}});multiplayer.channel=channel;
 channel.on("broadcast",{event:"game_action"},({payload})=>{
  if(!payload||payload.user_id===ludoUser.id||!multiplayer||multiplayer.inviteId!==roomId)return;
  if(payload.kind==="emoji"){showGameEmoji(payload.emoji,payload.username||"Friend");return;}
  if(payload.kind==="roll"&&multiplayer.started&&turn===payload.turn&&turn!==multiplayer.mySide&&die===null)rollDice(Number(payload.value),true);
  else if(payload.kind==="move"&&multiplayer.started&&turn===payload.turn&&turn!==multiplayer.mySide&&die!==null)doMove(payload.teamId,Number(payload.id),true);
  else if(payload.kind==="reset"&&multiplayer.started){multiplayer.finished=false;newGame();}
  else if(payload.kind==="finished"&&multiplayer){multiplayer.finished=true;setHint("Match complete — start another room match when ready.");}
  else if(payload.kind==="leave"&&multiplayer?.inviteId===roomId){
   const departed=multiplayer;multiplayer=null;if(departed.channel&&ludoSupabase)ludoSupabase.removeChannel(departed.channel).catch(()=>{});
   $("gameContent").style.display="none";$("modeSelector").style.display="none";$("friendRoomPanel").style.display="grid";$("homeDashboard").style.display="none";updateModeUI();
   setHint("A player left the room. Return to the home screen to start again.");lobbySetStatus("gameInviteStatus","A player left this room. You can invite friends to a new room.");toast("A player left the game.");
  }
 });
 channel.on("presence",{event:"sync"},()=>{
  if(!multiplayer||multiplayer.inviteId!==roomId)return;
  const presence=channel.presenceState(),seen=Object.values(presence).flat().map(p=>p.user_id);
  if(ordered.every(p=>seen.includes(p.id))&&!multiplayer.started){
   multiplayer.started=true;newGame();$("gameInviteStatus").textContent="🟢 Room ready · "+ordered.length+" players connected. Seat "+(multiplayer.mySide+1)+" is yours.";
   setHint(multiplayer.mySide===0?"Room match started! You are Red. Roll the dice.":"Room match started! Your turn will appear in seat order.");updateUI();toast("Ludo room ready · "+ordered.length+" players!");
  }
 });
 channel.subscribe(async status=>{
  if(status==="SUBSCRIBED"){try{await channel.track({user_id:userId,username:ludoProfile?.username||"Player",online_at:new Date().toISOString()});}
   catch(err){lobbySetStatus("gameInviteStatus","Room presence failed: "+(err.message||err),"error");}}
  else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT")lobbySetStatus("gameInviteStatus","Could not connect to online room. Check Supabase Realtime and refresh.","error");
 });
}
function enterOnlineMatch(invite,partner,mySide){
 const roster=mySide===0?[
  {id:ludoUser.id,username:ludoProfile?.username||"You",avatar_emoji:ludoProfile?.avatar_emoji||"🎮",seat:0},
  {id:partner.id,username:partner.username,avatar_emoji:partner.avatar_emoji||"🎮",seat:1}
 ]:[
  {id:partner.id,username:partner.username,avatar_emoji:partner.avatar_emoji||"🎮",seat:0},

 ];
 enterOnlineMatchGroup(invite.id,roster,ludoUser.id,false);
}
async function loadGameInvites(){
 if(!ludoSupabase||!ludoUser)return;
 try{
  const {data:rows,error}=await ludoSupabase.from("ludo_game_invites").select("id,sender_id,receiver_id,status,created_at,room_id,seat").or("sender_id.eq."+ludoUser.id+",receiver_id.eq."+ludoUser.id).order("created_at",{ascending:false}).limit(50);
  if(error)throw error;
  const relevant=(rows||[]).filter(r=>(r.status==="pending"||r.status==="accepted")&&!ignoredGameInviteIds.has(r.room_id||r.id));
  const ids=[...new Set(relevant.flatMap(r=>[r.sender_id,r.receiver_id]))];let profiles=[];
  if(ids.length){const {data,error:profileError}=await ludoSupabase.from("ludo_profiles").select("id,username,avatar_emoji").in("id",ids);if(profileError)throw profileError;profiles=data||[];}
  const byId=new Map(profiles.map(p=>[p.id,p]));
  const displayRoomId=activeRoomId||relevant.find(r=>r.room_id)?.room_id||null;
  if(displayRoomId){
   activeRoomId=displayRoomId;
   const {data:roomRows,error:roomError}=await ludoSupabase.from("ludo_game_invites").select("sender_id,receiver_id,status,room_id,seat").eq("room_id",displayRoomId).order("seat",{ascending:true});
   if(roomError)throw roomError;
   const room=roomRows||[],hostId=room[0]?.sender_id||ludoUser.id;
   const roomIds=[hostId,...room.map(r=>r.receiver_id)].filter((id,i,a)=>id&&a.indexOf(id)===i);
   const {data:roomProfiles,error:rpError}=await ludoSupabase.from("ludo_profiles").select("id,username,avatar_emoji").in("id",roomIds);
   if(rpError)throw rpError;
   const people=new Map((roomProfiles||[]).map(p=>[p.id,p]));
   const seats=[{id:hostId,seat:0,status:"host"},...room.map(r=>({id:r.receiver_id,seat:Number(r.seat),status:r.status}))];
   const occupied=new Set(seats.map(s=>s.seat));
   $("friendRoomCode").textContent=displayRoomId.slice(0,8).toUpperCase();
   const joined=seats.filter(s=>s.status==="host"||s.status==="accepted").length;
   $("friendRoomStatus").textContent=joined+" / 4 PLAYERS CONNECTED";
   $("friendRoomSlots").innerHTML=[0,1,2,3].map(seat=>{
    const slot=seats.find(s=>s.seat===seat),p=slot?people.get(slot.id):null;
    const host=seat===0,isJoined=host||slot?.status==="accepted";
    if(!slot)return '<div class="room-seat"><span class="seat-number">0'+(seat+1)+'</span><span class="seat-avatar">＋</span><span class="seat-name">OPEN SEAT</span><span class="seat-state">INVITE A FRIEND</span></div>';
    return '<div class="room-seat '+(isJoined?"joined":"")+(host?" host":"")+'"><span class="seat-number">0'+(seat+1)+'</span><span class="seat-avatar">'+lobbyEscape(p?.avatar_emoji||"🎮")+'</span><span class="seat-name">'+lobbyEscape(p?.username||"Player")+(host?" · HOST":"")+'</span><span class="seat-state">'+(host?"ROOM OWNER":isJoined?"✓ JOINED":"INVITE SENT · WAITING")+'</span></div>';
   }).join("");
  }
  const incoming=relevant.filter(r=>r.status==="pending"&&r.receiver_id===ludoUser.id);
  $("gameIncomingList").innerHTML=incoming.length?incoming.map(r=>{
   const p=byId.get(r.sender_id);if(!p)return "";
   return '<div class="friend-row"><div class="friend-icon">'+lobbyEscape(p.avatar_emoji||"🎮")+'</div><div class="friend-details"><div class="friend-name">@'+lobbyEscape(p.username)+'</div><div class="friend-state">Invites you to a Ludo room · seat '+(Number(r.seat)+1)+'</div><div class="game-request-actions"><button class="accept" data-game-response="accept" data-game-id="'+r.id+'">ACCEPT & JOIN</button><button data-game-response="decline" data-game-id="'+r.id+'">DECLINE</button></div></div></div>';
  }).filter(Boolean).join(""):'<div class="lobby-empty">No game invitations.</div>';
  document.querySelectorAll("[data-game-response]").forEach(btn=>btn.addEventListener("click",()=>respondToGameInvite(btn.dataset.gameId,btn.dataset.gameResponse)));
  const accepted=relevant.find(r=>r.status==="accepted");
  if(accepted){
   if(accepted.room_id){
    $("homeDashboard").style.display="none";$("modeSelector").style.display="none";$("friendRoomPanel").style.display="grid";$("gameContent").style.display="none";
    const {data:roomRows,error:roomError}=await ludoSupabase.from("ludo_game_invites").select("id,sender_id,receiver_id,status,room_id,seat").eq("room_id",accepted.room_id).order("seat",{ascending:true});
    if(roomError)throw roomError;
    const inviteRows=roomRows||[],pending=inviteRows.some(r=>r.status==="pending"),joined=inviteRows.filter(r=>r.status==="accepted");
    if(!pending&&joined.length){
     const hostId=inviteRows[0]?.sender_id;
     const playerIds=[hostId,...joined.map(r=>r.receiver_id)].filter((id,i,a)=>id&&a.indexOf(id)===i);
     const {data:roomProfiles,error:rpError}=await ludoSupabase.from("ludo_profiles").select("id,username,avatar_emoji").in("id",playerIds);
     if(rpError)throw rpError;
     const profileById=new Map((roomProfiles||[]).map(p=>[p.id,p]));
     const roster=playerIds.map(id=>{const p=profileById.get(id);return {id,username:p?.username||"Player",avatar_emoji:p?.avatar_emoji||"🎮"};}).map((p,index)=>({...p,seat:index}));
     if(roster.length>=2&&roster.length<=4)enterOnlineMatchGroup(accepted.room_id,roster,ludoUser.id,true);
    }else lobbySetStatus("gameInviteStatus","Room invites are being accepted. The room starts when all invited friends join.");
   }else{
    const partner=byId.get(accepted.sender_id===ludoUser.id?accepted.receiver_id:accepted.sender_id);
    if(partner)enterOnlineMatch(accepted,partner,accepted.sender_id===ludoUser.id?0:1);
   }
  }
  const outgoing=relevant.filter(r=>r.sender_id===ludoUser.id&&r.status==="pending");
  if(outgoing.length)lobbySetStatus("gameInviteStatus","Waiting for "+outgoing.length+" invited friend"+(outgoing.length===1?"":"s")+" to accept. All invited players must join before the room starts.");
 }catch(err){console.error("Ludo game invites:",err);lobbySetStatus("gameInviteStatus","Room invites need the updated supabase-setup.sql run in Supabase.","error");}
}

async function syncLobbyAuth(user){
 ludoUser=user||null;ludoProfile=null;
 if(!ludoUser){renderSignedOut();return;}
 try{
  const {data,error}=await ludoSupabase.from("ludo_profiles").select("*").eq("id",ludoUser.id).maybeSingle();
  if(error)throw error;
  ludoProfile=data;
  if(!ludoProfile){
   const desired=String(ludoUser.user_metadata?.ludo_username||ludoUser.email?.split("@")[0]||"player").toLowerCase().replace(/[^a-z0-9_]/g,"_").slice(0,20);
   if(!/^[a-z0-9_]{3,20}$/.test(desired))throw new Error("Your username profile is missing. Please sign up again with a valid username or contact support.");
   const {data:created,error:createError}=await ludoSupabase.from("ludo_profiles").insert({id:ludoUser.id,username:desired,avatar_emoji:"🎮"}).select("id,username,avatar_emoji").single();
   if(createError)throw createError;
   ludoProfile=created;
  }
  renderSignedIn();await startLobbyPresence();await loadLobby();
  if(lobbyRefreshTimer)clearInterval(lobbyRefreshTimer);
  lobbyRefreshTimer=setInterval(()=>{if(ludoUser)loadLobby();},6000);
 }catch(err){
  console.error("Ludo profile error:",err);
  renderSignedIn();lobbySetStatus("lobbyAuthStatus","Account signed in, but Ludo profile is not ready. Run supabase-setup.sql in Supabase.","error");
  lobbySetStatus("lobbyListStatus","Backend setup is required before username invitations can work.","error");
 }
}
async function initLobbyAuth(){

 if(data.session)await syncLobbyAuth(data.session.user);else renderSignedOut();

async function saveProfile(event){
 event.preventDefault();if(!ludoSupabase||!ludoUser||!ludoProfile)return;
 const username=$("profileUsername").value.trim().toLowerCase();
 if(!/^[a-z0-9_]{3,20}$/.test(username)){$("profileNote").textContent="Use 3–20 letters, numbers or underscores.";$("profileNote").className="auth-note error";return;}
 $("profileSaveBtn").disabled=true;$("profileSaveBtn").textContent="SAVING…";$("profileNote").textContent="Saving your profile…";$("profileNote").className="auth-note";
 try{
  const {data,error}=await ludoSupabase.from("ludo_profiles").update({username,avatar_emoji:selectedProfileAvatar}).eq("id",ludoUser.id).select("*").single();
  if(error)throw error;ludoProfile=data;renderSignedIn();await loadLobby();closeProfileEditor();toast("Profile updated successfully!");
 }catch(err){const msg=String(err.message||"Could not save profile.");$("profileNote").textContent=msg.toLowerCase().includes("duplicate")||msg.toLowerCase().includes("unique")?"That username is already taken. Try another one.":msg;$("profileNote").className="auth-note error";}
 finally{$("profileSaveBtn").disabled=false;$("profileSaveBtn").textContent="SAVE PROFILE";}
}
